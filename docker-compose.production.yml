services:
  mongo-production:
    image: mongo:7
    container_name: mongo-production
    restart: always
    networks:
      - web
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    volumes:
      - mongo_production_data:/data/db
      - mongo_production_config:/data/configdb

  redis-production:
    image: redis:7-alpine
    container_name: redis-production
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    networks:
      - web
    volumes:
      - redis_production_data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - APP_MODE=${APP_MODE:-production}
        - CACHEBUST=${CACHEBUST:-1}
    container_name: backend
    restart: unless-stopped
    environment:
      - APP_MODE=${APP_MODE:-production}
      - DOMAIN=${DOMAIN}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - OCI_TENANCY_OCID=${OCI_TENANCY_OCID}
      - OCI_USER_OCID=${OCI_USER_OCID}
      - OCI_FINGERPRINT=${OCI_FINGERPRINT}
      - OCI_PRIVATE_KEY=${OCI_PRIVATE_KEY}
      - OCI_REGION=${OCI_REGION}
      - OCI_NAMESPACE=${OCI_NAMESPACE}
      - OCI_BUCKET_NAME=${OCI_BUCKET_NAME}
    depends_on:
      - mongo-production
      - redis-production
    networks:
      - web

  frontend:
    image: alpine:latest
    container_name: frontend
    restart: "no"
    working_dir: /workspace
    volumes:
      - ./frontend/dist:/workspace/source:ro
      - frontend_dist:/workspace/output
    command:
      - sh
      - -c
      - |
        echo '=== Frontend Deployment Started ==='
        echo 'Source files:'
        ls -lah /workspace/source/assets/
        echo ''
        echo 'Cleaning output directory completely...'
        rm -rf /workspace/output/*
        rm -rf /workspace/output/.* 2>/dev/null || true
        echo 'Output cleaned!'
        echo ''
        echo 'Copying fresh files...'
        cp -r /workspace/source/* /workspace/output/
        echo ''
        echo '=== Deployment Complete ==='
        echo 'Deployed files:'
        ls -lah /workspace/output/assets/
        echo ''
        echo 'Keeping container alive...'
        tail -f /dev/null

  caddy:
    image: caddy:2-alpine
    container_name: bds-caddy
    restart: unless-stopped
    networks:
      - web
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./caddy/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - frontend_dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  mongo_production_data:
  mongo_production_config:
  redis_production_data:
  caddy_data:
  caddy_config:
  frontend_dist:

networks:
  web:
    external: true
