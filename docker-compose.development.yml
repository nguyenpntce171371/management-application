services:
  mongo-development:
    image: mongo:7
    container_name: mongo-development
    restart: unless-stopped
    networks:
      - web
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    volumes:
      - mongo_development_data:/data/db
      - mongo_development_config:/data/configdb

  redis-development:
    image: redis:7-alpine
    container_name: redis-development
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    networks:
      - web
    volumes:
      - redis_development_data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - APP_MODE=${APP_MODE:-development}
        - CACHEBUST=${CACHEBUST:-1}
    container_name: backend
    restart: unless-stopped
    volumes:
      - ./backend/src:/app/src
      - ./uploads:/app/uploads
    environment:
      - APP_MODE=${APP_MODE:-development}
      - DOMAIN=${DOMAIN}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    depends_on:
      - mongo-development
      - redis-development
    networks:
      - web

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - APP_MODE=development
    container_name: frontend
    restart: unless-stopped
    networks:
      - web
    environment:
      - APP_MODE=development
      - DOMAIN=${DOMAIN}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: bds-caddy
    restart: unless-stopped
    networks:
      - web
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./caddy/Caddyfile.development:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  code-server-init:
    image: busybox
    user: "0:0"
    volumes:
      - code_server_data:/data
    command: >
      sh -c "chown -R 1000:1000 /data"
    restart: "no"
    networks:
      - web

  code-server:
    image: codercom/code-server:latest
    user: "1000:1000"
    depends_on:
      code-server-init:
        condition: service_completed_successfully
    container_name: code-server
    restart: unless-stopped
    environment:
      SUDO_PASSWORD: nguyen
      PASSWORD: ${CODE_SERVER_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - .:/home/coder/project-bds
      - code_server_data:/home/coder/.local/share/code-server
    healthcheck:
      test: ["CMD", "test", "-d", "/home/coder/project-bds"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s
    command: >
      code-server
      --bind-addr 0.0.0.0:8080
      --auth password
      /home/coder/project-bds
    networks:
      - web

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    volumes:
      - C:/Users/ADMIN/.cloudflared:/etc/cloudflared
    networks:
      - web
    restart: unless-stopped
    profiles:
      - tunnel

volumes:
  mongo_development_data:
  mongo_development_config:
  redis_development_data:
  frontend_node_modules:
  caddy_data:
  caddy_config:
  code_server_data:

networks:
  web:
    external: true
